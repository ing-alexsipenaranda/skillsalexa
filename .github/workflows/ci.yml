name: CI

on:
  push:
    branches: [main, codex/evoll-alexa]
  pull_request:
    branches: [main]

concurrency:
  group: alexa-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test · Package · Operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Test and validate complete release
        run: npm run release:preflight

      - name: Validate operational scripts
        run: bash -n scripts/backup-vps.sh scripts/health-vps.sh scripts/update-vps.sh scripts/verify-production.sh scripts/release-preflight.sh

      - name: Validate Alexa-hosted archive
        run: |
          unzip -l dist/evoll-alexa-hosted.zip
          test "$(unzip -Z1 dist/evoll-alexa-hosted.zip | sort | tr '\n' ' ')" = "lambda/index.js lambda/package.json "

      - name: Validate distribution icons
        run: node -e "const fs=require('node:fs');for(const n of [108,512]){const b=fs.readFileSync('assets/alexa/evoll-alexa-'+n+'.png');if(b.readUInt32BE(16)!==n||b.readUInt32BE(20)!==n)process.exit(1)}"

      - name: Upload reviewable packages
        uses: actions/upload-artifact@v4
        with:
          name: evoll-alexa-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/SHA256SUMS
            dist/evoll-lambda.zip
            dist/evoll-linking.tar.gz
            dist/evoll-alexa-hosted.zip
            dist/evoll-docker.tar.gz
            assets/alexa/evoll-alexa-108.png
            assets/alexa/evoll-alexa-512.png
