name: evoll-alexa
services:
  linking:
    build: .
    image: evoll-alexa-linking:local
    restart: unless-stopped
    init: true
    env_file:
      - ./broker/.env
    environment:
      NODE_ENV: production
      BIND_HOST: 0.0.0.0
      PORT: "3000"
      BROKER_DB: /data/evoll-alexa.sqlite
    ports:
      - "127.0.0.1:${EVOLL_LOCAL_PORT:-3187}:3000"
    volumes:
      - evoll_tokens:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  evoll_tokens:
